<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PrismaX">
  <defs>
    <linearGradient id="px-bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="42%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="px-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#A855F7" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#px-bg)" filter="url(#px-glow)"/>
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#FFFFFF"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.04em"
  >PX</text>
